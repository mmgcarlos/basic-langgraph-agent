name: Test and Deploy LangGraph Agent

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-with-ollama:
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: --name ollama
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov langchain-ollama
      
      - name: Wait for Ollama
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "✅ Ollama is ready!"
              break
            fi
            echo "⏳ Waiting for Ollama... ($i/30)"
            sleep 2
          done
      
      - name: Pull model
        run: |
          python scripts/pull_model.py
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.2:3b
      
      - name: Run tests with Ollama
        env:
          USE_OLLAMA: true
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.2:3b
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          pytest tests/ -v --cov=src/agent

  deploy:
    needs: test-with-ollama
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install LangGraph CLI
        run: pip install langgraph-cli
      
      - name: Deploy with Gemini (Production)
        env:
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          # Deploy with Gemini for production
          # This preserves your API key for production use only
          echo "🚀 Deploying to production..."
          # langgraph deploy --api-key $LANGCHAIN_API_KEY
